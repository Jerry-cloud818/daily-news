name: 每日新闻生成 & 部署

on:
  schedule:
    # 每天 UTC 14:00 = 北京时间 22:00
    - cron: '0 14 * * *'
  workflow_dispatch:  # 手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser requests jinja2 beautifulsoup4 lxml

      - name: Generate daily news
        run: |
          cd daily_news
          python main.py

      - name: Copy output to docs
        run: |
          mkdir -p docs
          cp daily_news/output/latest.html docs/index.html

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html daily_news/output/
          git diff --staged --quiet || git commit -m "新闻更新 $(date +'%Y-%m-%d %H:%M')"
          git push

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
