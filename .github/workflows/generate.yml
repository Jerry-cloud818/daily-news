name: 每日新闻生成

on:
  schedule:
    # 每天 UTC 14:00 = 北京时间 22:00
    - cron: '0 14 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser requests jinja2 beautifulsoup4 lxml

      - name: Generate daily news
        working-directory: daily_news
        run: python main.py

      - name: Update GitHub Pages
        run: |
          cp daily_news/output/latest.html docs/index.html
          cp daily_news/output/news_*.json docs/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m " 新闻更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          git push
